[pytest]
# the application under test lives in a separate folder next to this one
pythonpath = ../student-management-system
# loadfile: in a parallel run (-n) each test file stays on one worker, so its tests keep their order
addopts = -ra --strict-markers --dist loadfile
markers =
    smoke: quick happy-path checks (group 1, runs first)
    unit: ECP/BVA cases for one function (group 2)
    negative: invalid input and error paths (group 3)
    data_driven: cases read from data/*.csv (group 4, runs last)
    grading: module sms.grading
    models: module sms.models
    school: module sms.school
