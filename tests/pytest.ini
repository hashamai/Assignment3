[pytest]

# add the project under test to the python import path
pythonpath = ../student-management-system

# execution order of the test groups: pytest runs these files in this order
testpaths =
    test_grading.py
    test_models.py
    test_school.py
    test_data_driven.py

# groups of tests; run one group with:  pytest -m smoke
markers =
    smoke: one basic check per function, runs first
    negative: invalid input that the code must reject

# -ra              print a short summary of failed and skipped tests at the end
# --dist loadfile  in a parallel run (pytest -n auto) each file stays on one worker
addopts = -ra --dist loadfile
